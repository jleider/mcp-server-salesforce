version: '3.8'

services:
  salesforce-mcp-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Salesforce Configuration - REQUIRED
      SALESFORCE_CONNECTION_TYPE: "${SALESFORCE_CONNECTION_TYPE:-User_Password}"
      SALESFORCE_USERNAME: "${SALESFORCE_USERNAME}"
      SALESFORCE_PASSWORD: "${SALESFORCE_PASSWORD}"
      SALESFORCE_TOKEN: "${SALESFORCE_TOKEN}"
      SALESFORCE_INSTANCE_URL: "${SALESFORCE_INSTANCE_URL:-https://login.salesforce.com}"
      
      # HTTP Server Configuration
      MCP_HTTP_PORT: "${MCP_HTTP_PORT:-3000}"
      MCP_HTTP_HOST: "${MCP_HTTP_HOST:-0.0.0.0}"
      
      # Security Configuration
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-127.0.0.1:3000,localhost:3000,127.0.0.1,localhost}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      
      # CORS Configuration
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const options = { hostname: '127.0.0.1', port: process.env.MCP_HTTP_PORT || 3000, path: '/health', timeout: 2000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped